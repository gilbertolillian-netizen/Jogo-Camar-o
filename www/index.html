<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camarão Tycoon</title>
<style>
:root{--bg:#fff7ee;--card:#ffffff;--tx:#3a2418;--mu:#8a6a58;--ac:#ff6b4a;--ac2:#ffb199;--ok:#2e9e6a;--bd:#f0d9c8;--glass:#ffffffc7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1410;--card:#2a1d17;--tx:#fbe9dc;--mu:#b89885;--ac:#ff7a5a;--ac2:#6b3326;--ok:#4cc58a;--bd:#43302580;--glass:#1d1410b8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1410;--card:#2a1d17;--tx:#fbe9dc;--mu:#b89885;--ac:#ff7a5a;--ac2:#6b3326;--ok:#4cc58a;--bd:#433025;--glass:#1d1410b8;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{background:var(--bg)}
html,body{margin:0;min-height:100%;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{max-width:520px;margin:0 auto;padding:12px}
.top{text-align:center;background:var(--glass);border-radius:14px;padding:8px;backdrop-filter:blur(3px);position:relative}
#bg{position:fixed;inset:0;z-index:-1}
.stage{font-size:13px;color:var(--mu)}
.money{font-size:32px;font-weight:800}
.ps{font-size:13px;color:var(--mu)}
.tap{position:relative;display:flex;justify-content:center;margin:10px 0}
#btn{width:170px;height:170px;border-radius:50%;border:6px solid var(--ac);background:var(--card);font-size:80px;cursor:pointer;transition:transform .06s}
#btn:active{transform:scale(.92)}
.fl{position:absolute;pointer-events:none;font-weight:800;color:var(--ok);animation:up .9s forwards}
@keyframes up{to{transform:translateY(-80px);opacity:0}}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.it .i{flex:1}.it b{display:block}.it small{color:var(--mu)}
.it button{min-width:92px;padding:9px 6px;border-radius:10px;border:0;background:var(--ok);color:#fff;font-weight:700}
.it button:disabled{background:var(--bd);color:var(--mu)}
.adv{width:100%;padding:13px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:800;font-size:15px;margin-top:4px}
.adv:disabled{background:var(--ac2);color:var(--mu)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac);width:0}
.boost{color:var(--ac);font-weight:700;font-size:13px;text-align:center;min-height:18px}
.rs{font-size:12px;color:var(--tx);text-align:center;margin-top:14px;background:var(--glass);border-radius:10px;padding:6px}
.rs a{color:var(--tx)}

.gear{position:absolute;right:6px;top:4px;background:none;border:0;font-size:22px;cursor:pointer;padding:4px}
#cfg,#shop,#don{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:5}
#cfg.on,#shop.on,#don.on{display:flex}
.box{background:var(--card);color:var(--tx);border-radius:16px;padding:16px;width:min(92vw,380px);max-height:90vh;overflow:auto}
.box b{font-size:17px}.box .row{margin-top:14px}.box small{display:block;color:var(--mu);margin-bottom:6px}
.seg{display:flex;gap:6px}
.seg button,.wide{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:600;width:100%}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wide{margin-top:8px}
#accm{font-size:12px;color:var(--mu);margin-top:6px}
#ev{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);max-width:504px;margin:0 auto;background:var(--card);color:var(--tx);border:2px solid var(--ac);border-radius:14px;padding:10px;z-index:4;display:none;box-shadow:0 4px 16px #0006}
#ev b{font-size:15px}#ev small{display:block;color:var(--mu);margin:2px 0 8px}
#ev .seg{flex-wrap:wrap}#ev .seg button{padding:9px;font-size:13px}#ev .seg button:disabled{opacity:.45}
#evbar{height:4px;background:var(--bd);border-radius:3px;margin-top:8px;overflow:hidden}#evb{height:100%;background:var(--ac);width:100%}
.sd{font-size:12px;font-style:italic;color:var(--mu);margin-top:3px;line-height:1.35}
em{font-style:italic;color:var(--tx);opacity:.85}
.sn{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sn button{flex:1 1 30%;padding:9px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;font-size:13px}
.sn button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);background:var(--card);color:var(--tx);border:2px solid var(--ac);border-radius:12px;padding:8px 14px;z-index:6;display:none;max-width:90vw;font-size:14px;font-weight:600;text-align:center;box-shadow:0 4px 16px #0006}
#btn.sk1{border-color:#ffc107;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,251,230,.75) 50%,rgba(255,255,255,0) 65%) 150% 0/250% 100% no-repeat,radial-gradient(circle at 35% 30%,#fff6c8,#ffd54f 55%,#c79100);box-shadow:0 0 18px #ffc10799;animation:shim 3.2s linear infinite,glo1 2s ease-in-out infinite alternate}
#btn.sk2{border-color:var(--ac);background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 24%) 0 0/200% 200% no-repeat,radial-gradient(circle at 35% 30%,#fff,#f6e6f4 55%,#d9c4e8);box-shadow:0 0 18px #e8c9f2aa;animation:wand 5s ease-in-out infinite,glo2 2.4s ease-in-out infinite alternate}
#btn.sk3{border-radius:28%;background:#0b0f1a;border-color:var(--ac);box-shadow:0 0 22px var(--ac),inset 0 0 18px var(--ac);animation:neon 1.6s ease-in-out infinite alternate}
#btn.sk4{border-radius:60% 40% 55% 45%/50% 55% 45% 50%;border-color:#4dd0e1;background:radial-gradient(circle at 30% 25%,#e0f7fa,#4dd0e1 60%,#0097a7);box-shadow:0 0 18px #4dd0e199;animation:blob 6s ease-in-out infinite,flt 3s ease-in-out infinite alternate,glo4 2.4s ease-in-out infinite alternate}
@keyframes shim{from{background-position:150% 0,0 0}to{background-position:-50% 0,0 0}}
@keyframes glo1{from{box-shadow:0 0 12px #ffc10766}to{box-shadow:0 0 30px #ffd54fcc}}
@keyframes wand{0%{background-position:0% 0%,0 0}25%{background-position:100% 0%,0 0}50%{background-position:100% 100%,0 0}75%{background-position:0% 100%,0 0}100%{background-position:0% 0%,0 0}}
@keyframes glo2{from{box-shadow:0 0 12px #e8c9f288}to{box-shadow:0 0 28px #f6d5ffcc}}
@keyframes neon{from{box-shadow:0 0 10px var(--ac),0 0 0 rgba(255,255,255,0),inset 0 0 8px var(--ac)}to{box-shadow:0 0 34px var(--ac),0 0 6px #fff,inset 0 0 24px var(--ac)}}
@keyframes blob{0%,100%{border-radius:60% 40% 55% 45%/50% 55% 45% 50%}33%{border-radius:45% 55% 40% 60%/55% 45% 55% 45%}66%{border-radius:55% 45% 60% 40%/45% 55% 50% 50%}}
@keyframes flt{from{translate:0 0}to{translate:0 -5px}}
@keyframes glo4{from{box-shadow:0 0 12px #4dd0e166}to{box-shadow:0 0 30px #4dd0e1cc}}

document.getElementById("list").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.sub!==undefined){sub=+t.dataset.sub;if(sub==3)rkLoad();render();return}
  if(t.dataset.bq!==undefined){G.bq=+t.dataset.bq;save();render();return}
  if(t.id=="rkr"){rkLoad();return}
  if(t.id=="nks"){nickSave();return}
  if(t.id=="adv"){var s=S[G.s];if(G.m>=s.adv){G.s++;G.m=0;G.o=[0,0,0,0];G.cl=0;G.pm*=1.5;advanced();save();render()}return}
  var id=t.dataset.id;if(!id||t.disabled)return;
  if(id=="cl"){var b=bulkCl();if(G.m>=b.c){G.m-=b.c;G.cl+=b.n;bought(b.n)}}
  else if(id[0]=="g"){var i=+id[1],b=bulkGen(i);if(G.m>=b.c){G.m-=b.c;G.o[i]+=b.n;bought(b.n)}}
  else if(id=="f1"&&Date.now()>=G.fc){G.bt=Date.now()+3e4;G.fc=Date.now()+6e4;freeUsed()}
  else if(id=="f2"&&Date.now()>=G.ft){G.m+=dps()*60;G.ft=Date.now()+45e3;freeUsed()}
  else if(id=="rb"){doReset();return}
  else if(id.slice(0,3)=="mq_"){claimQ(+id.slice(3))}
  render();
});

function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return ("000"+c.toString(16).toUpperCase()).slice(-4)}
function tlv(id,v){var l=String(v.length);return id+(l.length<2?"0"+l:l)+v}
function pixClean(s,n){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").toUpperCase().slice(0,n)}
function pixPayload(v){
  var m=tlv("00","br.gov.bcb.pix")+tlv("01",DON.pix);
  var p=tlv("00","01")+tlv("01","11")+tlv("26",m)+tlv("52","0000")+tlv("53","986")+(v?tlv("54",v.toFixed(2)):"")+tlv("58","BR")+tlv("59",pixClean(DON.nome||"APOIO",25))+tlv("60",pixClean(DON.cidade||"BRASIL",15))+tlv("62",tlv("05","***"))+"6304";
  return p+crc16(p);
}
function b64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function idHash(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%1000003;return h}
function redeemCode(code){
  return new Promise(function(ok){
    try{
      var p=String(code).replace(/\s+/g,"").split(".");
      if(p.length!=3||(p[0]!="CAM1"&&p[0]!="MOR1"&&p[0]!="SAL1"&&p[0]!="DEV1"))return ok("Código inválido.");
      var pr=p[1].split("-"),id=pr[0],dia=+pr[1];
      if(!id||!(dia>0))return ok("Código inválido.");
      var sub=window.crypto&&window.crypto.subtle;if(!sub)return ok("Este aparelho não consegue validar o código (precisa de conexão segura).");
      sub.importKey("jwk",DON.pub,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]).then(function(k){
        return sub.verify({name:"ECDSA",hash:"SHA-256"},k,b64u(p[2]),new TextEncoder().encode(p[0]+"."+p[1]))
      }).then(function(v){
        if(!v)return ok("Código inválido.");
        if(p[0]=="DEV1"){
          if(Date.now()/864e5-dia>2)return ok("Este código expirou (vale por 2 dias).");
          if(DEVOK&&G.dn.devcode)return ok("O modo desenvolvedor já está ativo.");
          var dc=String(code).replace(/\s+/g,"");G.dn.devcode=dc;G.dn.devon=1;DEVOK=true;
          try{localStorage.setItem("camarao_dev",dc)}catch(e){}
          save();sfx("ach");render();return ok("dev");
        }
        if(p[0]=="MOR1"||p[0]=="SAL1"){
          var kk=p[0]=="MOR1"?"mor":"sal";
          if(G.dn.used.indexOf(id)>=0||G.dn[kk])return ok("Este código já foi usado.");
          G.dn.used.push(id);G.dn[kk]=1;G.dn[kk=="mor"?"mshow":"sshow"]=1;save();sfx("ach");skinApply();render();return ok(kk);
        }
        if(Date.now()/864e5-dia>60)return ok("Este código expirou (vale por 60 dias).");
        if(G.dn.used.indexOf(id)>=0)return ok("Este código já foi usado.");
        G.dn.used.push(id);G.dn.until=Math.max(Date.now(),G.dn.until)+7*864e5;
        var av=[1,2,3,4].filter(function(x){return G.dn.sk.indexOf(x)<0}),msg="ok";
        if(av.length){var n=av[idHash(id)%av.length];G.dn.sk.push(n);G.dn.sel=n;msg="ok:"+n}
        save();sfx("ach");render();ok(msg)
      }).catch(function(){ok("Código inválido.")});
    }catch(e){ok("Código inválido.")}
  });
}

/* ===== Música de fundo (sintetizada, sem arquivos de áudio) ===== */
var MU={on:0,armed:0,step:0,next:0,tm:null,g:null,nb:null};
var MSTEP=60/96/2;
var MC=[{r:48,c:[60,64,67]},{r:45,c:[57,60,64]},{r:41,c:[53,57,60]},{r:43,c:[55,59,62]},{r:48,c:[60,64,67]},{r:45,c:[57,60,64]},{r:38,c:[50,53,57]},{r:43,c:[55,59,62]}];
var ML=[[76,0,0,74,72,0,67,0],[69,0,72,0,76,0,0,0],[77,0,76,0,72,0,69,0],[74,0,71,0,67,0,0,0],[72,0,76,0,79,0,76,0],[81,0,79,0,76,0,72,0],[74,0,77,0,81,0,77,0],[79,0,76,74,72,0,0,0]];
function mf(n){return 440*Math.pow(2,(n-69)/12)}
function mTone(f,t,d,type,vol,att){
  var o=AU.createOscillator(),g=AU.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(MU.g);o.start(t);o.stop(t+d+.05);
}
function mKick(t){
  var o=AU.createOscillator(),g=AU.createGain();
  o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);
  o.connect(g);g.connect(MU.g);o.start(t);o.stop(t+.22);
}
function mHat(t){
  var s=AU.createBufferSource(),f=AU.createBiquadFilter(),g=AU.createGain();
  s.buffer=MU.nb;f.type="highpass";f.frequency.value=7000;
  g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  s.connect(f);f.connect(g);g.connect(MU.g);s.start(t);
}
function muStep(s,t){
  var bar=(s>>3)%8,k=s&7,ch=MC[bar];
  mTone(mf(ch.c[[0,1,2,1,0,1,2,1][k]]+12),t,.45,"triangle",.1,.005);
  if(k==0)mTone(mf(ch.r),t,.9,"sine",.28,.01);
  if(k==3)mTone(mf(ch.r),t,.4,"sine",.2,.01);
  if(k==4)mTone(mf(ch.r+7),t,.5,"sine",.2,.01);
  if(k==6)mTone(mf(ch.r+12),t,.35,"sine",.14,.01);
  var m=ML[bar][k];if(m)mTone(mf(m),t,.6,"sine",.16,.01);
  if(k==0||k==4)mKick(t);
  if(k&1)mHat(t);
}
function muSched(){
  if(!MU.on||!AU)return;
  while(MU.next<AU.currentTime+.25){muStep(MU.step%64,MU.next);MU.next+=MSTEP;MU.step++}
}
function muVol(){if(!MU.g)return;var v=Math.pow(SND.mv/100,2)*.6;try{MU.g.gain.setTargetAtTime(v,AU.currentTime,.05)}catch(e){MU.g.gain.value=v}}
function muStart(){
  if(MU.on||!SND.m)return;
  try{
    if(!AU)AU=new (window.AudioContext||window.webkitAudioContext)();
    if(AU.state=="suspended")AU.resume();
    if(!MU.g){
      MU.g=AU.createGain();MU.g.connect(AU.destination);
      var b=AU.createBuffer(1,Math.floor(AU.sampleRate*.06),AU.sampleRate),d=b.getChannelData(0);
      for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      MU.nb=b;
    }
    muVol();MU.on=1;MU.step=0;MU.next=AU.currentTime+.1;
    MU.tm=setInterval(muSched,100);
  }catch(e){MU.on=0}
}
function muStop(){MU.on=0;if(MU.tm){clearInterval(MU.tm);MU.tm=null}}
document.getElementById("musb").onclick=function(){
  SND.m=SND.m?0:1;
  if(SND.m){MU.armed=1;muStart();sfx("buy")}else muStop();
  sndSave();
};
document.getElementById("musv").addEventListener("input",function(e){
  SND.mv=+e.target.value;MU.armed=1;
  if(SND.mv==0)SND.m=0;else if(!SND.m){SND.m=1}
  if(SND.m)muStart();else muStop();
  muVol();sndRender();
});
document.getElementById("musv").addEventListener("change",function(){sndSave()});
document.addEventListener("pointerdown",function(){if(!MU.armed){MU.armed=1;muStart()}},true);
document.addEventListener("visibilitychange",function(){if(document.hidden)muStop();else if(SND.m&&MU.armed)muStart()});

/* ===== Modo desenvolvedor (código DEV1, ×10 em renda e toque, permanente) ===== */
var DEVOK=false;
function devm(){return DEVOK&&G&&G.dn&&G.dn.devon?10:1}
function codeSig(code){
  return new Promise(function(res){
    try{
      var p=String(code||"").replace(/\s+/g,"").split(".");
      if(p.length!=3)return res(null);
      var pr=p[1].split("-"),id=pr[0],sub=window.crypto&&window.crypto.subtle;
      if(!sub||!window.DON||!DON.pub||!id)return res(null);
      sub.importKey("jwk",DON.pub,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]).then(function(k){
        return sub.verify({name:"ECDSA",hash:"SHA-256"},k,b64u(p[2]),new TextEncoder().encode(p[0]+"."+p[1]))
      }).then(function(v){res(v?{pre:p[0],id:id}:null)}).catch(function(){res(null)});
    }catch(e){res(null)}
  });
}
function devRestore(){
  var c="";try{c=(G&&G.dn&&G.dn.devcode)||localStorage.getItem("camarao_dev")||""}catch(e){}
  if(!c){DEVOK=false;return}
  codeSig(c).then(function(r){
    DEVOK=!!(r&&r.pre=="DEV1");
    if(DEVOK&&G.dn&&!G.dn.devcode){G.dn.devcode=String(c).replace(/\s+/g,"")}
    render();
  });
}
devRestore();
render();
